@if (loading()) {
  <div class="empty-state">Loading sprint...</div>
} @else {
  <div class="breadcrumb">
    <a [routerLink]="['/workspaces', workspaceId]">Workspace</a>
    <span class="breadcrumb-separator">/</span>
    <a [routerLink]="['/workspaces', workspaceId, 'projects', projectId]">Project</a>
    <span class="breadcrumb-separator">/</span>
    <a [routerLink]="['/workspaces', workspaceId, 'projects', projectId, 'sprints']">Sprints</a>
    <span class="breadcrumb-separator">/</span>
    <span>Edit</span>
  </div>

  <div class="page-header">
    <h1 class="page-title">Edit Sprint</h1>
  </div>

  @if (error()) {
    <div class="alert alert-error">{{ error() }}</div>
  }

  <div class="card form-card">
    <form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col gap-2">
      <div class="form-group">
        <label class="form-label" for="name">Sprint name</label>
        <input id="name" type="text" class="form-control" formControlName="name" />
        @if (form.controls.name.touched && form.controls.name.invalid) {
          <span class="field-error">Name is required (min 2 characters).</span>
        }
      </div>

      <div class="form-group">
        <label class="form-label" for="goal">Goal</label>
        <textarea id="goal" class="form-control" formControlName="goal"></textarea>
      </div>

      <div class="grid grid-2">
        <div class="form-group">
          <label class="form-label" for="startDate">Start date</label>
          <input id="startDate" type="date" class="form-control" formControlName="startDate" />
        </div>
        <div class="form-group">
          <label class="form-label" for="endDate">End date</label>
          <input id="endDate" type="date" class="form-control" formControlName="endDate" />
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="status">Status</label>
        <select id="status" class="form-control" formControlName="status">
          <option value="planning">Planning</option>
          <option value="active">Active</option>
          <option value="completed">Completed</option>
          <option value="cancelled">Cancelled</option>
        </select>
      </div>

      <div class="form-actions">
        <a [routerLink]="['/workspaces', workspaceId, 'projects', projectId, 'sprints', sprintId]" class="btn btn-secondary">Cancel</a>
        <button type="submit" class="btn btn-primary" [disabled]="saving()">
          {{ saving() ? 'Saving...' : 'Save Changes' }}
        </button>
      </div>
    </form>
  </div>
}
