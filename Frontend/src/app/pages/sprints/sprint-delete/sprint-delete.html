<div class="card empty-state delete-confirm">
  <div class="warning-icon">⚠️</div>
  <h2>Delete Sprint</h2>
  <p class="text-secondary">
    This action is permanent and cannot be undone. Tasks assigned to this sprint
    will be unassigned, not deleted.
  </p>

  @if (error()) {
  <div class="alert alert-error">{{ error() }}</div>
  }

  <div class="page-actions justify-center mt-3">
    <button
      type="button"
      class="btn btn-secondary"
      (click)="cancel()"
      [disabled]="deleting()"
    >
      Cancel
    </button>
    <button
      type="button"
      class="btn btn-danger"
      (click)="deleteSprint()"
      [disabled]="deleting()"
    >
      {{ deleting() ? 'Deleting...' : 'Delete Sprint' }}
    </button>
  </div>
</div>
