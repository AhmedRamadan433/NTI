@if (loading()) {
<div class="empty-state">Loading sprint...</div>
} @else { @if (sprint(); as s) {
<div class="breadcrumb">
  <a routerLink="/workspaces">Workspaces</a>
  <span class="breadcrumb-separator">/</span>
  <a [routerLink]="['/workspaces', workspaceId()]">Workspace</a>
  <span class="breadcrumb-separator">/</span>
  <a [routerLink]="['/workspaces', workspaceId(), 'projects', projectId()]"
    >Project</a
  >
  <span class="breadcrumb-separator">/</span>
  <a
    [routerLink]="['/workspaces', workspaceId(), 'projects', projectId(), 'sprints', s._id]"
    >{{ s.name }}</a
  >
</div>

<div class="page-header">
  <h1 class="page-title">{{ s.name }}</h1>
  <div class="page-actions">
    <a
      [routerLink]="['/workspaces', workspaceId(), 'projects', projectId(), 'sprints', s._id, 'edit']"
      class="btn btn-secondary btn-sm"
      >Edit</a
    >
  </div>
</div>

<div class="card">
  <h3>Sprint Goal</h3>
  <p>{{ s.goal || 'No goal set' }}</p>
</div>

<div class="card">
  <h3>Dates</h3>
  <div class="flex gap-2">
    <div>
      <span class="text-secondary text-sm">Start Date:</span>
      <span>{{ s.startDate }}</span>
    </div>
    <div>
      <span class="text-secondary text-sm">End Date:</span>
      <span>{{ s.endDate }}</span>
    </div>
  </div>
</div>
} @else {
<div class="card empty-state">
  <h3>Sprint not found</h3>
  <a
    [routerLink]="['/workspaces', workspaceId(), 'projects', projectId(), 'sprints']"
    class="btn btn-primary mt-2"
    >Back to Sprints</a
  >
</div>
} }
