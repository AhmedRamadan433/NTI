<div class="page-header">
  <h1 class="page-title">Settings</h1>
</div>

@if (saved()) {
  <div class="alert alert-success">Settings saved successfully.</div>
}

<div class="card form-card">
  <form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col gap-2">
    <div class="form-group">
      <label class="form-label" for="theme">Theme</label>
      <select id="theme" class="form-control" formControlName="theme">
        <option value="light">Light</option>
        <option value="dark">Dark</option>
        <option value="system">System</option>
      </select>
    </div>

    <div class="form-group">
      <label class="form-label" for="timezone">Timezone</label>
      <select id="timezone" class="form-control" formControlName="timezone">
        <option value="UTC">UTC</option>
        <option value="America/New_York">America/New York</option>
        <option value="America/Los_Angeles">America/Los Angeles</option>
        <option value="Europe/London">Europe/London</option>
        <option value="Asia/Tokyo">Asia/Tokyo</option>
      </select>
    </div>

    <div class="form-group checkbox-group">
      <label class="checkbox-label">
        <input type="checkbox" formControlName="emailNotifications" />
        Email notifications
      </label>
    </div>

    <div class="form-group checkbox-group">
      <label class="checkbox-label">
        <input type="checkbox" formControlName="pushNotifications" />
        Push notifications
      </label>
    </div>

    <div class="form-actions">
      <button type="submit" class="btn btn-primary" [disabled]="saving()">
        {{ saving() ? 'Saving...' : 'Save Settings' }}
      </button>
    </div>
  </form>
</div>
