@if (loading()) {
  <div class="empty-state">Loading task...</div>
} @else {
  <div class="breadcrumb">
    <a [routerLink]="['/workspaces', workspaceId]">Workspace</a>
    <span class="breadcrumb-separator">/</span>
    <a [routerLink]="['/workspaces', workspaceId, 'projects', projectId]">Project</a>
    <span class="breadcrumb-separator">/</span>
    <a [routerLink]="['/workspaces', workspaceId, 'projects', projectId, 'tasks']">Tasks</a>
    <span class="breadcrumb-separator">/</span>
    <span>Edit</span>
  </div>

  <div class="page-header">
    <h1 class="page-title">Edit Task</h1>
  </div>

  @if (error()) {
    <div class="alert alert-error">{{ error() }}</div>
  }

  <div class="card form-card">
    <form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col gap-2">
      <div class="form-group">
        <label class="form-label" for="title">Title</label>
        <input id="title" type="text" class="form-control" formControlName="title" />
        @if (form.controls.title.touched && form.controls.title.invalid) {
          <span class="field-error">Title is required (min 2 characters).</span>
        }
      </div>

      <div class="form-group">
        <label class="form-label" for="description">Description</label>
        <textarea id="description" class="form-control" formControlName="description"></textarea>
      </div>

      <div class="grid grid-2">
        <div class="form-group">
          <label class="form-label" for="status">Status</label>
          <select id="status" class="form-control" formControlName="status">
            <option value="todo">To Do</option>
            <option value="in-progress">In Progress</option>
            <option value="review">Review</option>
            <option value="done">Done</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label" for="priority">Priority</label>
          <select id="priority" class="form-control" formControlName="priority">
            <option value="low">Low</option>
            <option value="medium">Medium</option>
            <option value="high">High</option>
            <option value="urgent">Urgent</option>
          </select>
        </div>
      </div>

      <div class="grid grid-2">
        <div class="form-group">
          <label class="form-label" for="dueDate">Due date</label>
          <input id="dueDate" type="date" class="form-control" formControlName="dueDate" />
        </div>
        <div class="form-group">
          <label class="form-label" for="assigneeId">Assignee ID</label>
          <input id="assigneeId" type="text" class="form-control" formControlName="assigneeId" />
        </div>
      </div>

      <div class="form-actions">
        <a [routerLink]="['/workspaces', workspaceId, 'projects', projectId, 'tasks', taskId]" class="btn btn-secondary">Cancel</a>
        <button type="submit" class="btn btn-primary" [disabled]="saving()">
          {{ saving() ? 'Saving...' : 'Save Changes' }}
        </button>
      </div>
    </form>
  </div>
}
