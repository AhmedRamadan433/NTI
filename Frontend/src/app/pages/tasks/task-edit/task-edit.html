@if (loading()) {
<div class="empty-state">Loading task...</div>
} @else {
<div class="breadcrumb">
  <a [routerLink]="['/workspaces', workspaceId]">Workspace</a>
  <span class="breadcrumb-separator">/</span>
  <a [routerLink]="['/workspaces', workspaceId, 'projects', projectId]"
    >Project</a
  >
  <span class="breadcrumb-separator">/</span>
  <a [routerLink]="['/workspaces', workspaceId, 'projects', projectId, 'tasks']"
    >Tasks</a
  >
  <span class="breadcrumb-separator">/</span>
  <span>Edit</span>
</div>

<div class="page-header">
  <h1 class="page-title">Edit Task</h1>
</div>

@if (error()) {
<div class="alert alert-error">{{ error() }}</div>
}

<div class="card form-card">
  <form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col gap-2">
    <div class="form-group">
      <label class="form-label" for="name">Name</label>
      <input
        id="name"
        type="text"
        class="form-control"
        formControlName="name"
      />
      @if (form.controls.name.touched && form.controls.name.invalid) {
      <span class="field-error">Name is required (min 2 characters).</span>
      }
    </div>

    <div class="form-group">
      <label class="form-label" for="description">Description</label>
      <textarea
        id="description"
        class="form-control"
        formControlName="description"
      ></textarea>
    </div>

    <div class="grid grid-2">
      <div class="form-group">
        <label class="form-label" for="status">Status</label>
        <select id="status" class="form-control" formControlName="status">
          <option value="To_Do">To Do</option>
          <option value="In_Progress">In Progress</option>
          <option value="Done">Done</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label" for="priority">Priority</label>
        <select id="priority" class="form-control" formControlName="priority">
          <option value="low">Low</option>
          <option value="medium">Medium</option>
          <option value="high">High</option>
          <option value="urgent">Urgent</option>
        </select>
      </div>
    </div>

    <div class="grid grid-2">
      <div class="form-group">
        <label class="form-label" for="endDate">Due date</label>
        <input
          id="endDate"
          type="date"
          class="form-control"
          formControlName="endDate"
        />
      </div>
      <div class="form-group">
        <label class="form-label" for="assignedTo">Assignee ID(s)</label>
        <input
          id="assignedTo"
          type="text"
          class="form-control"
          placeholder="comma-separated user IDs"
          [value]="form.controls.assignedTo.value.join(', ')"
          (change)="onAssignedToChange($event)"
        />
      </div>
    </div>

    <div class="form-actions">
      <a
        [routerLink]="['/workspaces', workspaceId, 'projects', projectId, 'tasks', taskId]"
        class="btn btn-secondary"
        >Cancel</a
      >
      <button type="submit" class="btn btn-primary" [disabled]="saving()">
        {{ saving() ? 'Saving...' : 'Save Changes' }}
      </button>
    </div>
  </form>
</div>
}
