<div class="page-centered">
  <div class="card delete-card">
    <div class="delete-icon-wrapper">
      <svg
        class="warning-icon"
        viewBox="0 0 24 24"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
      >
        <path
          d="M12 9V13M12 17H12.01M10.29 3.86L1.82 18A2 2 0 0 0 3.55 21H20.45A2 2 0 0 0 22.18 18L13.71 3.86A2 2 0 0 0 10.29 3.86Z"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
    </div>

    <h1 class="delete-title">Delete Project</h1>
    <p class="delete-subtitle">
      This action is permanent and cannot be undone.
    </p>

    <div class="delete-warning-box">
      Deleting this project will permanently remove all associated tasks and
      sprints.
    </div>

    @if (error()) {
    <div class="alert alert-error">{{ error() }}</div>
    }

    <div class="delete-actions">
      <button
        type="button"
        class="btn btn-secondary"
        (click)="cancel()"
        [disabled]="deleting()"
      >
        Cancel
      </button>
      <button
        type="button"
        class="btn btn-danger"
        (click)="deleteProject()"
        [disabled]="deleting()"
      >
        {{ deleting() ? 'Deleting...' : 'Delete Project' }}
      </button>
    </div>
  </div>
</div>
