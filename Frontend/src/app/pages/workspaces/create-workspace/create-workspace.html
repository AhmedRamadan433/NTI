<div class="breadcrumb">
  <a routerLink="/workspaces">Workspaces</a>
  <span class="breadcrumb-separator">/</span>
  <span>Create</span>
</div>

<div class="page-header">
  <h1 class="page-title">Create Workspace</h1>
</div>

@if (error()) {
  <div class="alert alert-error">{{ error() }}</div>
}

<div class="card form-card">
  <form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col gap-2">
    <div class="form-group">
      <label class="form-label" for="name">Workspace name</label>
      <input id="name" type="text" class="form-control" formControlName="name" placeholder="My Workspace" />
      @if (form.controls.name.touched && form.controls.name.invalid) {
        <span class="field-error">Name is required (min 2 characters).</span>
      }
    </div>

    <div class="form-group">
      <label class="form-label" for="slug">Slug</label>
      <input id="slug" type="text" class="form-control" formControlName="slug" placeholder="my-workspace" />
      @if (form.controls.slug.touched && form.controls.slug.invalid) {
        <span class="field-error">Lowercase letters, numbers, and hyphens only.</span>
      }
    </div>

    <div class="form-group">
      <label class="form-label" for="description">Description (optional)</label>
      <textarea id="description" class="form-control" formControlName="description" placeholder="What is this workspace for?"></textarea>
    </div>

    <div class="form-actions">
      <a routerLink="/workspaces" class="btn btn-secondary">Cancel</a>
      <button type="submit" class="btn btn-primary" [disabled]="loading()">
        {{ loading() ? 'Creating...' : 'Create Workspace' }}
      </button>
    </div>
  </form>
</div>
