<div class="breadcrumb">
  <a routerLink="/attachments">Attachments</a>
  <span class="breadcrumb-separator">/</span>
  <span>Upload</span>
</div>

<div class="page-header">
  <h1 class="page-title">Upload File</h1>
</div>

@if (error()) {
  <div class="alert alert-error">{{ error() }}</div>
}

<div class="card form-card">
  <div class="upload-zone">
    <input type="file" (change)="onFileSelected($event)" class="form-control" />
    @if (selectedFile(); as file) {
      <div class="file-info">
        <span class="badge badge-info">{{ file.name }}</span>
        <span class="text-secondary text-sm">{{ (file.size / 1024).toFixed(1) }} KB</span>
      </div>
    }
  </div>

  <div class="form-actions">
    <a routerLink="/attachments" class="btn btn-secondary">Cancel</a>
    <button class="btn btn-primary" (click)="upload()" [disabled]="uploading()">
      {{ uploading() ? 'Uploading...' : 'Upload' }}
    </button>
  </div>
</div>
